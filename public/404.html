<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>IRMA</title>
    <script>
      (function (location) {
        var pathSegmentsToKeep = 1;
        var base =
          location.protocol +
          "//" +
          location.hostname +
          (location.port ? ":" + location.port : "") +
          location.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/");

        var route = location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~");

        var query = location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "";

        location.replace(base + "/?/" + route + query + location.hash);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
